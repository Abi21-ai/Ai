<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat AI</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#1c1c1a;--muted:#6b6b66;--accent:#2f6fed;--bot:#ececE8;--border:#dcdcd6}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--text:#eeeeea;--muted:#9a9a94;--accent:#3b63c4;--bot:#2c2c2a;--border:#3a3a37}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border)}
h1{font-size:16px;margin:0}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
button:disabled{opacity:.5}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;line-height:1.45}
.me{align-self:flex-end;background:var(--accent);color:#fff}
.bot{align-self:flex-start;background:var(--bot)}
.err{color:#d33}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
form{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--border)}
textarea{flex:1;resize:none;height:44px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
</style>
</head>
<body>
<header><h1>🤖 Chat AI</h1>
<div><select id="style"><option value="santai">Santai</option><option value="kasar">Kasar</option><option value="formal">Formal</option></select> <button class="ghost" id="clr">Hapus</button></div></header>
<div id="chat"></div>
<form id="f"><textarea id="in" placeholder="Ketik pesan..."></textarea><button id="send">Kirim</button></form>
<script>
var chat = document.getElementById('chat');
var input = document.getElementById('in');
var sendBtn = document.getElementById('send');
var history = [];

function add(text, cls) {
  var d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send() {
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  add(text, 'me');
  history.push({ role: 'user', content: text });
  var out = add('...', 'bot');
  sendBtn.disabled = true;
  try {
    var r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, style: document.getElementById('style').value })
    });
    var data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Request gagal');
    out.textContent = data.reply;
    history.push({ role: 'assistant', content: data.reply });
  } catch (e) {
    out.textContent = 'Error: ' + e.message;
    out.classList.add('err');
    history.pop();
  }
  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); send(); });
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('clr').onclick = function () { history = []; chat.innerHTML = ''; };
</script>
</body>
</html>
